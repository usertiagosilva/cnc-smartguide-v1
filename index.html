<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CNC SmartGuide</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/icons/favicon.png">

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Ícones -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

  <div class="container">

    <!-- Header -->
    <header>

      <div class="logo">

        <i class="fa-solid fa-gears"></i>

        <div>

          <h1>CNC SmartGuide</h1>

          <p>
            Assistente Operacional CNC
          </p>

        </div>

      </div>

    </header>

    <!-- Conteúdo Principal -->
    <main>

      <section class="search-section">

        <h2>Diagnóstico Rápido</h2>

        <p class="subtitle">
          Selecione a máquina e o problema operacional.
        </p>

        <!-- Cards das Máquinas -->
        <div class="machines-grid">

          <!-- TNL 12.1 -->
          <div
            class="machine-card"
            data-machine="TNL 12.1"
          >

            <img
              src="assets/img/tnl12.1.jpg"
              alt="TNL 12.1"
            >

            <h3>TNL 12.1</h3>

          </div>

          <!-- TNL 12.2 -->
          <div
            class="machine-card"
            data-machine="TNL 12.2"
          >

            <img
              src="assets/img/tnl12.2.jpg"
              alt="TNL 12.2"
            >

            <h3>TNL 12.2</h3>

          </div>

          <!-- TNL 20 -->
          <div
            class="machine-card"
            data-machine="TNL 20"
          >

            <img
              src="assets/img/tnl20.jpg"
              alt="TNL 20"
            >

            <h3>TNL 20</h3>

          </div>

          <!-- TNL 18 -->
          <div
            class="machine-card"
            data-machine="TNL 18"
          >

            <img
              src="assets/img/tnl18.jpg"
              alt="TNL 18"
            >

            <h3>TNL 18</h3>

          </div>

        </div>

        <!-- Seleção do Problema -->
        <select id="problemSelect">

          <option value="">
            Selecione o problema
          </option>

        </select>

        <!-- Botão -->
        <button onclick="showSolution()">

          <i class="fa-solid fa-screwdriver-wrench"></i>

          Mostrar Solução

        </button>

      </section>

      <!-- Resultado -->
      <section id="result" class="result-box">

        <div class="empty-state">

          <i class="fa-solid fa-screwdriver-wrench"></i>

          <p>
            Selecione uma máquina para começar.
          </p>

        </div>

      </section>

    </main>

  </div>

  <!-- JavaScript -->
  <script src="assets/js/script.js"></script>

</body>
</html>
